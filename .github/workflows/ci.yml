name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/test_adapter_contract.py is a structural check (every adapter
      # implements the required interface) -- it needs no live database.
      # scripts/smoke_test.py, which does need real running graph databases,
      # is intentionally not run here; that's what the benchmark itself is for.
      # `python -m pytest` (not the bare `pytest` script) so the repo
      # root is added to sys.path and `import benchmark` resolves --
      # otherwise it only works locally by accident of how it happens to
      # be invoked there. Scoped to tests/ so pytest's default *_test.py
      # pattern doesn't also try to collect scripts/smoke_test.py, which
      # needs live database connections and isn't a pytest test at all.
      - name: Run adapter contract tests
        run: python -m pytest tests/ -v
